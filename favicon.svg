<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicons cannot load the page's webfonts, so "CL" falls back to a
       bold serif stack. Close to the brand's slab character and legible
       at 16px; exact Alfa Slab One would need outlined paths. -->
  <rect width="32" height="32" rx="5" fill="#1A1310"/>
  <circle cx="16" cy="16" r="13" fill="#9E2D24"/>
  <text x="16" y="16"
        text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="14" letter-spacing="-0.5"
        fill="#F2EADB">CL</text>
</svg>
