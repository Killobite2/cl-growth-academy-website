<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="">
  <!-- Article figure: the two paths for a Facebook or Instagram ad side by
       side, a page on the provider's website and a Facebook lead form, with
       the trade-off for each. Text only and no people. For
       blog/ndis-facebook-ads-guide.html, section "Should I send people to my
       website or use Facebook lead forms?". The full comparison table is in
       the markup beside this figure. Drawn for an ink surface.

       Palette hardcoded because an <img>-loaded SVG is a separate document
       and cannot read the page's :root tokens. Generic font stack because
       Work Sans is loaded by the page, not by this file. Loaded via <img>,
       never inlined. -->
  <rect width="800" height="500" fill="#1A1310"/>

  <rect x="60" y="50" width="325" height="400" rx="8" fill="#9E2D24"/>
  <rect x="415" y="50" width="325" height="400" rx="8" fill="none" stroke="#C9BFAE" stroke-width="3"/>

  <!-- Website glyph: a browser window -->
  <rect x="152" y="92" width="140" height="104" rx="8" fill="none" stroke="#F2EADB" stroke-width="5"/>
  <line x1="152" y1="118" x2="292" y2="118" stroke="#F2EADB" stroke-width="5"/>
  <g fill="#F2DFA8">
    <rect x="170" y="134" width="104" height="12" rx="4"/>
    <rect x="170" y="156" width="74" height="12" rx="4" opacity="0.7"/>
  </g>

  <!-- Lead form glyph: stacked fields and a button -->
  <rect x="514" y="88" width="128" height="112" rx="8" fill="none" stroke="#F2EADB" stroke-width="5"/>
  <g fill="none" stroke="#C9BFAE" stroke-width="3">
    <rect x="532" y="104" width="92" height="20" rx="3"/>
    <rect x="532" y="132" width="92" height="20" rx="3"/>
  </g>
  <rect x="532" y="162" width="92" height="22" rx="4" fill="#D4A038"/>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <g fill="#F2EADB" font-size="32" font-weight="700">
      <text x="222" y="262">Website</text>
      <text x="578" y="262">Lead form</text>
    </g>
    <g fill="#F2EADB" font-size="23">
      <text x="222" y="318">Fewer enquiries</text>
      <text x="222" y="364" fill="#F2DFA8">Generally higher</text>
      <text x="222" y="394" fill="#F2DFA8">quality</text>
      <text x="578" y="318">More enquiries</text>
      <text x="578" y="364" fill="#F2DFA8">Call back the</text>
      <text x="578" y="394" fill="#F2DFA8">same day</text>
    </g>
  </g>
</svg>
