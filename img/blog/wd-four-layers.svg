<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="">
  <!-- Service figure: the four layers of page on an NDIS provider website,
       numbered in build order. Text only, as the brief asks. For
       ndis-marketing/website-design.html, section "How should you organise
       an NDIS website?". The labels are the page's own list, shortened only
       where a line would not fit. Drawn for an ink surface.

       Palette hardcoded because an <img>-loaded SVG is a separate document
       and cannot read the page's :root tokens. The font stack is generic for
       the same reason: Work Sans is loaded by the page, not by this file.
       Loaded via <img>, never inlined. -->
  <rect width="800" height="500" fill="#1A1310"/>

  <!-- One band per layer. Layer 1 is the strongest because it is the one
       to build first; the others step down in weight. -->
  <g fill="#9E2D24">
    <rect x="60" y="56" width="680" height="88" rx="6" opacity="0.95"/>
    <rect x="60" y="156" width="680" height="88" rx="6" opacity="0.78"/>
    <rect x="60" y="256" width="680" height="88" rx="6" opacity="0.62"/>
    <rect x="60" y="356" width="680" height="88" rx="6" opacity="0.48"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <g fill="#D4A038" font-size="28" font-weight="700">
      <text x="92" y="111">01</text>
      <text x="92" y="211">02</text>
      <text x="92" y="311">03</text>
      <text x="92" y="411">04</text>
    </g>
    <g fill="#F2EADB" font-size="24" font-weight="700">
      <text x="160" y="94">Service pages</text>
      <text x="160" y="194">Accommodation pages</text>
      <text x="160" y="294">Funding-scheme pages</text>
      <text x="160" y="394">Standard pages</text>
    </g>
    <g fill="#F2DFA8" font-size="20">
      <text x="160" y="125">By condition and support type</text>
      <text x="160" y="225">SIL, SDA, respite, vacancies, location hubs</text>
      <text x="160" y="325">iCare, TAC and DVA</text>
      <text x="160" y="425">Home, about, team, contact, careers, privacy</text>
    </g>
  </g>
</svg>
