<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="">
  <!-- Blog card artwork: acceleration. Brand hex is hardcoded rather than
       using custom properties — this loads through <img>, which renders it
       as a separate document with no access to the page's :root tokens.
       Same reason favicon.svg hardcodes its palette. -->
  <rect width="800" height="500" fill="#1A1310"/>

  <!-- Tick marks, drawn under the arc so the sweep sits on top of them -->
  <g stroke="#F2EADB" stroke-width="7" stroke-linecap="round" opacity="0.45">
    <line x1="185" y1="350" x2="200" y2="350"/>
    <line x1="248" y1="198" x2="259" y2="209"/>
    <line x1="400" y1="135" x2="400" y2="150"/>
    <line x1="552" y1="198" x2="541" y2="209"/>
    <line x1="615" y1="350" x2="600" y2="350"/>
  </g>

  <!-- Gauge track, then the mustard sweep over roughly three quarters of it.
       Semicircle arc length is pi * 190 = 596.9, so 430 of dash reads as ~72%. -->
  <path d="M 210 350 A 190 190 0 0 1 590 350" fill="none" stroke="#9E2D24"
        stroke-width="34" stroke-linecap="round"/>
  <path d="M 210 350 A 190 190 0 0 1 590 350" fill="none" stroke="#D4A038"
        stroke-width="34" stroke-linecap="round" stroke-dasharray="430 600"/>

  <!-- Needle, landing at the end of the mustard sweep -->
  <line x1="400" y1="350" x2="496" y2="234" stroke="#F2EADB"
        stroke-width="13" stroke-linecap="round"/>
  <circle cx="400" cy="350" r="23" fill="#F2EADB"/>
  <circle cx="400" cy="350" r="9" fill="#1A1310"/>
</svg>
