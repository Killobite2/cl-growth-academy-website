<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 567" role="img" aria-label="">
  <!-- Service figure: the website types table as a graphic, five rows, the
       type of provider beside its rough page count. The type names are the
       table's first column in full, word for word, wrapped onto more lines
       where needed, beside the "Rough page count" column; rows grow to fit,
       so the canvas is 800x567. The pages each type needs are in the table
       in the markup beside this figure. For
       ndis-marketing/website-design.html, section "How many pages does an
       NDIS website need?". Drawn for an ink surface.

       Palette hardcoded because an <img>-loaded SVG is a separate document
       and cannot read the page's :root tokens. Generic font stack because
       Work Sans is loaded by the page, not by this file. Loaded via <img>,
       never inlined. -->
  <rect width="800" height="567" fill="#1A1310"/>

  <g font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="2" fill="#D4A038">
    <text x="76" y="68">WEBSITE TYPE</text>
    <text x="432" y="68">ROUGH PAGE COUNT</text>
  </g>

  <g fill="#9E2D24">
    <rect x="50" y="88" width="700" height="105" rx="5" opacity="0.9"/>
    <rect x="50" y="203" width="700" height="66" rx="5" opacity="0.75"/>
    <rect x="50" y="279" width="700" height="80" rx="5" opacity="0.9"/>
    <rect x="50" y="369" width="700" height="66" rx="5" opacity="0.75"/>
    <rect x="50" y="445" width="700" height="80" rx="5" opacity="0.9"/>
  </g>

  <!-- Column split, carried down all five rows -->
  <g stroke="#D4A038" stroke-width="3" opacity="0.5">
    <line x1="410" y1="100" x2="410" y2="181"/>
    <line x1="410" y1="215" x2="410" y2="257"/>
    <line x1="410" y1="291" x2="410" y2="347"/>
    <line x1="410" y1="381" x2="410" y2="423"/>
    <line x1="410" y1="457" x2="410" y2="513"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="21">
    <g fill="#F2EADB">
      <text x="76" y="122.5">New or single-service</text>
      <text x="76" y="147.5">provider (for example,</text>
      <text x="76" y="172.5">support work in one region)</text>
      <text x="76" y="243">Multi-service provider</text>
      <text x="76" y="313.5">SIL and SDA</text>
      <text x="76" y="338.5">accommodation provider</text>
      <text x="76" y="409">Allied health practice</text>
      <text x="76" y="479.5">Provider funded through</text>
      <text x="76" y="504.5">iCare, TAC or DVA</text>
    </g>
    <g fill="#F2DFA8" font-weight="700">
      <text x="432" y="147.5">10 to 15</text>
      <text x="432" y="243">25 to 40 or more</text>
      <text x="432" y="326">15 to 25, plus one per home</text>
      <text x="432" y="409">15 to 30</text>
      <text x="432" y="492">Add 1 per scheme</text>
    </g>
  </g>
</svg>
