<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="">
  <!-- Blog card artwork for blog/how-to-get-ndis-clients.html: two doors,
       two paths, converging on one point. Shapes only. Palette hardcoded
       because an <img>-loaded SVG cannot read the page's :root tokens. -->
  <rect width="800" height="500" fill="#1A1310"/>

  <!-- The two doors: plain arches, the referrer door full strength -->
  <path d="M90 214 V104 a44 44 0 0 1 88 0 V214 Z" fill="#9E2D24"/>
  <path d="M90 420 V310 a44 44 0 0 1 88 0 V420 Z" fill="#9E2D24" opacity="0.7"/>
  <g fill="#F2DFA8">
    <circle cx="162" cy="164" r="6"/>
    <circle cx="162" cy="370" r="6"/>
  </g>

  <!-- Two paths that become one -->
  <g fill="none" stroke-width="12" stroke-linecap="round">
    <path d="M200 160 C340 160 380 250 500 250" stroke="#F2EADB"/>
    <path d="M200 366 C340 366 380 250 500 250" stroke="#F2EADB" opacity="0.55"/>
    <path d="M500 250 L572 250" stroke="#D4A038"/>
  </g>

  <!-- Where they meet: rings and a cream core, the same family as the
       bullseye on the Google Ads card -->
  <circle cx="650" cy="250" r="76" fill="#9E2D24"/>
  <circle cx="650" cy="250" r="50" fill="#1A1310"/>
  <circle cx="650" cy="250" r="24" fill="#F2DFA8"/>
</svg>
