<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="">
  <!-- Blog card artwork for blog/ndis-facebook-ads-guide.html: a stack of
       feed cards beside a pin and its radius rings. Shapes only, no
       platform logos. Palette hardcoded because an <img>-loaded SVG cannot
       read the page's :root tokens. -->
  <rect width="800" height="500" fill="#1A1310"/>

  <!-- Feed cards, fanned so the stack reads as a set of varied ads -->
  <rect x="150" y="96" width="210" height="290" rx="14" fill="none" stroke="#A89C88" stroke-width="5" opacity="0.6"/>
  <rect x="124" y="114" width="210" height="290" rx="14" fill="none" stroke="#C9BFAE" stroke-width="5" opacity="0.8"/>
  <rect x="98" y="132" width="210" height="290" rx="14" fill="#9E2D24"/>
  <rect x="118" y="152" width="170" height="150" rx="8" fill="#F2DFA8" opacity="0.9"/>
  <rect x="118" y="322" width="150" height="16" rx="8" fill="#F2EADB"/>
  <rect x="118" y="350" width="100" height="16" rx="8" fill="#F2EADB" opacity="0.6"/>
  <rect x="118" y="382" width="70" height="22" rx="11" fill="#D4A038"/>

  <!-- Radius around a pin -->
  <circle cx="570" cy="260" r="150" fill="none" stroke="#9E2D24" stroke-width="8" stroke-dasharray="20 14"/>
  <circle cx="570" cy="260" r="88" fill="#9E2D24"/>
  <path d="M570 290 C550 262 534 246 534 224 a36 36 0 0 1 72 0 C606 246 590 262 570 290 Z" fill="#F2DFA8"/>
  <circle cx="570" cy="224" r="13" fill="#1A1310"/>
</svg>
