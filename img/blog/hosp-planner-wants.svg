<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="">
  <!-- Article figure: the four things hospital discharge planners want from
       an NDIS provider, each beside what good looks like. The page's table
       as a graphic, in its own words. Text only and no people. For
       blog/ndis-clients-from-hospitals.html, section "What do discharge
       planners want from an NDIS provider?". Taller than 800x500 because
       the condition-experience row runs to three lines. Drawn for an ink
       surface.

       Palette hardcoded because an <img>-loaded SVG is a separate document
       and cannot read the page's :root tokens. Generic font stack because
       Work Sans is loaded by the page, not by this file. Loaded via <img>,
       never inlined. -->
  <rect width="800" height="600" fill="#1A1310"/>

  <g font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="2" fill="#D4A038">
    <text x="80" y="58">WHAT THEY WANT</text>
    <text x="392" y="58">WHAT GOOD LOOKS LIKE</text>
  </g>

  <g fill="#9E2D24">
    <rect x="60" y="78" width="680" height="116" rx="6" opacity="0.9"/>
    <rect x="60" y="204" width="680" height="116" rx="6" opacity="0.7"/>
    <rect x="60" y="330" width="680" height="128" rx="6" opacity="0.9"/>
    <rect x="60" y="468" width="680" height="100" rx="6" opacity="0.7"/>
  </g>

  <g stroke="#D4A038" stroke-width="3" opacity="0.5">
    <line x1="368" y1="96" x2="368" y2="176"/>
    <line x1="368" y1="222" x2="368" y2="302"/>
    <line x1="368" y1="348" x2="368" y2="440"/>
    <line x1="368" y1="486" x2="368" y2="550"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <g fill="#F2EADB" font-size="23" font-weight="700">
      <text x="84" y="130">A named</text>
      <text x="84" y="159">clinical contact</text>
      <text x="84" y="256">A written first-</text>
      <text x="84" y="285">48-hours plan</text>
      <text x="84" y="388">Stated condition</text>
      <text x="84" y="417">experience</text>
      <text x="84" y="526">Speed</text>
    </g>
    <g fill="#F2DFA8" font-size="20">
      <text x="392" y="130">One person and one phone</text>
      <text x="392" y="158">number, with no shared inbox</text>
      <text x="392" y="256">Who arrives, when, what they</text>
      <text x="392" y="284">do and who signs off</text>
      <text x="392" y="370">The conditions your team</text>
      <text x="392" y="398">supports today, by name, with</text>
      <text x="392" y="426">the training behind it</text>
      <text x="392" y="512">A call back the same day and</text>
      <text x="392" y="540">a start date you can keep</text>
    </g>
  </g>
</svg>
