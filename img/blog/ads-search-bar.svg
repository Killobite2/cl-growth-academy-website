<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="">
  <!-- Article figure: what a participant actually sees on a results page.
       The paid row sits above the organic ones, which fade as they descend.
       For attract-ndis-participants-with-google-ads.html, section "How it
       actually works". Drawn for an ink surface.

       Palette hardcoded because an <img>-loaded SVG is a separate document
       and cannot read the page's :root tokens. Always loaded via <img>,
       never inlined, so the ids below cannot collide with another file's. -->
  <rect width="800" height="500" fill="#1A1310"/>

  <!-- The search field. Rounded to read as an input rather than a card. -->
  <rect x="90" y="58" width="620" height="72" rx="36" fill="none"
        stroke="#F2EADB" stroke-width="4" opacity="0.75"/>
  <!-- Typed query, as a weight of text rather than letters: real <text> in
       an img-loaded SVG is invisible to search and to a screen reader. -->
  <rect x="140" y="88" width="300" height="12" rx="6" fill="#F2EADB" opacity="0.5"/>
  <circle cx="648" cy="94" r="17" fill="none" stroke="#D4A038" stroke-width="5"/>
  <path d="M660 106 L678 124" stroke="#D4A038" stroke-width="5" stroke-linecap="round"/>

  <!-- The paid result. Mustard chip plus a full-brightness row, so it reads
       as the one that was bought. -->
  <rect x="90" y="186" width="72" height="34" rx="6" fill="#D4A038"/>
  <rect x="178" y="192" width="330" height="10" rx="5" fill="#F2EADB"/>
  <rect x="178" y="212" width="210" height="8" rx="4" fill="#F2EADB" opacity="0.55"/>

  <!-- The organic results below it, at falling opacity. The fall is the
       point of the graphic: attention runs out on the way down. -->
  <g fill="#9E2D24">
    <rect x="90" y="268" width="420" height="12" rx="6" opacity="0.9"/>
    <rect x="90" y="330" width="380" height="12" rx="6" opacity="0.6"/>
    <rect x="90" y="392" width="340" height="12" rx="6" opacity="0.35"/>
  </g>
  <g fill="#F2EADB" opacity="0.22">
    <rect x="90" y="292" width="300" height="8" rx="4"/>
    <rect x="90" y="354" width="270" height="8" rx="4"/>
    <rect x="90" y="416" width="240" height="8" rx="4"/>
  </g>

  <!-- The fold. Everything under this line is a scroll the reader may not
       make. -->
  <path d="M90 452 L710 452" stroke="#D4A038" stroke-width="3"
        stroke-dasharray="14 12" opacity="0.7"/>
</svg>
